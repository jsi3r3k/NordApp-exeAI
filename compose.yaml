services:
  api:
    build:
      context: .
    init: true
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/health"
          )
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  huggingface-cache: